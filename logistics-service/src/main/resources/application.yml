spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/logistics_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: logistics-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Shipment events are a side effect of shipping, not part of it. Without a
        # bound here the producer blocks the HTTP thread for the 60s default while
        # it looks for topic metadata, so handing a parcel to a courier hung and
        # then failed whenever Kafka was unreachable.
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
