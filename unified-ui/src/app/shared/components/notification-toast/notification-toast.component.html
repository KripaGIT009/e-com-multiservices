<div class="toast-container" aria-live="polite" aria-atomic="true">
  <div
    *ngFor="let notification of notifications$ | async"
    class="toast toast--{{ notification.severity }}"
    [attr.role]="notification.severity === 'error' || notification.severity === 'warning' ? 'alert' : 'status'"
    [attr.aria-label]="notification.severity + ': ' + notification.message"
  >
    <span class="toast-icon">{{ getIcon(notification.severity) }}</span>
    <span class="toast-message">{{ notification.message }}</span>
    <button
      class="toast-dismiss"
      (click)="dismiss(notification.id)"
      aria-label="Dismiss notification"
    >
      ✕
    </button>
  </div>
</div>
