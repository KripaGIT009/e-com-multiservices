<section class="admin-dashboard" aria-label="Admin Dashboard">
  <h1 class="page-title">Admin Dashboard</h1>

  <div *ngIf="isLoading" class="loading-state" role="status" aria-live="polite">
    <p>Loading dashboard...</p>
  </div>

  <div *ngIf="!isLoading">
    <!-- Summary Cards -->
    <div class="stats-grid" role="group" aria-label="Dashboard Statistics">
      <div class="stat-card">
        <p class="stat-value">{{ stats.totalOrders }}</p>
        <p class="stat-label">Total Orders</p>
      </div>
      <div class="stat-card">
        <p class="stat-value">{{ stats.totalUsers }}</p>
        <p class="stat-label">Total Users</p>
      </div>
      <div class="stat-card">
        <p class="stat-value">{{ stats.totalItems }}</p>
        <p class="stat-label">Total Products</p>
      </div>
      <div class="stat-card">
        <p class="stat-value">₹{{ stats.totalRevenue | number:'1.0-0' }}</p>
        <p class="stat-label">Total Revenue</p>
      </div>
    </div>

    <!-- Admin Navigation -->
    <h2 class="section-title">Management</h2>
    <nav class="admin-nav-grid" aria-label="Admin navigation">
      <a
        *ngFor="let link of adminLinks"
        class="admin-nav-card"
        [routerLink]="link.path"
        [attr.aria-label]="link.label">
        <span class="nav-icon" aria-hidden="true">{{ link.icon }}</span>
        <span class="nav-label">{{ link.label }}</span>
      </a>
    </nav>
  </div>
</section>
