<section class="admin-dashboard" aria-label="Admin Dashboard">
  <h1 class="admin-dashboard__title">Admin Dashboard</h1>

  <!-- Error State -->
  <div *ngIf="errorMessage" class="admin-dashboard__error" role="alert">
    <p class="admin-dashboard__error-message">{{ errorMessage }}</p>
    <button
      class="admin-dashboard__retry-btn"
      (click)="retry()"
      aria-label="Retry loading dashboard data">
      Retry
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading && !errorMessage" class="admin-dashboard__loading" role="status" aria-live="polite">
    <app-kpi-cards [isLoading]="true"></app-kpi-cards>
  </div>

  <!-- Dashboard Content -->
  <div *ngIf="!isLoading && !errorMessage">
    <!-- KPI Cards -->
    <app-kpi-cards [data]="dashboardSummary" [isLoading]="false"></app-kpi-cards>

    <!-- Quick Actions -->
    <app-quick-actions></app-quick-actions>

    <!-- Charts and Data Visualizations -->
    <div class="admin-dashboard__grid">
      <!-- Revenue Chart -->
      <div class="admin-dashboard__panel admin-dashboard__panel--wide">
        <app-revenue-chart></app-revenue-chart>
      </div>

      <!-- Order Status Chart -->
      <div class="admin-dashboard__panel">
        <app-order-status-chart></app-order-status-chart>
      </div>

      <!-- Top Products Table -->
      <div class="admin-dashboard__panel">
        <app-top-products-table></app-top-products-table>
      </div>

      <!-- Low Stock Alerts -->
      <div class="admin-dashboard__panel">
        <app-low-stock-alerts
          [lowStockCount]="dashboardSummary?.lowStockCount || 0"
          [isLoading]="isLoading">
        </app-low-stock-alerts>
      </div>

      <!-- Activity Feed -->
      <div class="admin-dashboard__panel">
        <app-activity-feed></app-activity-feed>
      </div>
    </div>
  </div>
</section>
