<section class="order-history-page" aria-label="Order History">
  <h1 class="page-title">My Orders</h1>

  <div *ngIf="isLoading" class="loading-state" role="status" aria-live="polite">
    <p>Loading orders...</p>
  </div>

  <div *ngIf="!isLoading && orders.length === 0" class="empty-state">
    <p>No orders yet. Start shopping to see your order history!</p>
  </div>

  <div class="orders-list" *ngIf="!isLoading && orders.length > 0" role="list" aria-label="Orders">
    <article *ngFor="let order of orders" class="order-card" role="listitem">
      <div class="order-header">
        <div class="order-id">
          <span class="label">Order #</span>
          <span class="value">{{ order.id }}</span>
        </div>
        <span class="status-badge" [ngClass]="getStatusClass(order.status)">{{ order.status }}</span>
      </div>
      <div class="order-body">
        <div class="order-items">
          <p *ngFor="let item of order.items" class="order-item">
            {{ item.productName }} × {{ item.quantity }}
          </p>
        </div>
        <div class="order-meta">
          <span class="order-date">{{ order.createdAt | date:'mediumDate' }}</span>
          <span class="order-total">₹{{ order.totalAmount | number:'1.2-2' }}</span>
        </div>
      </div>
    </article>
  </div>
</section>
