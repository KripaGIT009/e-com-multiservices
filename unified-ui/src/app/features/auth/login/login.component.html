<section class="auth-page" aria-label="Login to MyIndianStore">
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-card__logo">
      <img src="assets/images/logo.png" alt="MyIndianStore" class="auth-card__logo-img" />
    </div>

    <!-- Lock icon and heading -->
    <div class="auth-card__header">
      <span class="auth-card__icon" aria-hidden="true">🔒</span>
      <h1 class="auth-card__heading">Login to Your Account</h1>
    </div>

    <!-- Aria-live region for error announcements -->
    <div aria-live="polite" aria-atomic="true" class="auth-card__announcements">
      <span *ngIf="email?.invalid && email?.touched && email?.errors?.['required']">
        Email is required.
      </span>
      <span *ngIf="email?.invalid && email?.touched && email?.errors?.['email']">
        Please enter a valid email.
      </span>
      <span *ngIf="password?.invalid && password?.touched && password?.errors?.['required']">
        Password is required.
      </span>
      <span *ngIf="password?.invalid && password?.touched && password?.errors?.['minlength']">
        Password must be at least 8 characters.
      </span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-card__form" novalidate>
      <!-- Email field -->
      <div class="auth-card__field">
        <label for="login-email" class="auth-card__label">Email Address</label>
        <div class="auth-card__input-wrapper">
          <span class="auth-card__field-icon" aria-hidden="true">✉</span>
          <input
            id="login-email"
            type="email"
            formControlName="email"
            class="auth-card__input"
            [class.auth-card__input--invalid]="email?.invalid && email?.touched"
            placeholder="Enter your email"
            aria-describedby="login-email-error"
          />
        </div>
        <span id="login-email-error" class="auth-card__error" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Email is required.</span>
          <span *ngIf="email?.errors?.['email']">Please enter a valid email.</span>
        </span>
      </div>

      <!-- Password field -->
      <div class="auth-card__field">
        <label for="login-password" class="auth-card__label">Password</label>
        <div class="auth-card__input-wrapper">
          <span class="auth-card__field-icon" aria-hidden="true">🔒</span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="login-password"
            formControlName="password"
            class="auth-card__input auth-card__input--with-toggle"
            [class.auth-card__input--invalid]="password?.invalid && password?.touched"
            placeholder="Enter your password"
            aria-describedby="login-password-error"
          />
          <button
            type="button"
            class="auth-card__toggle-password"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <span aria-hidden="true">{{ showPassword ? '🙈' : '👁' }}</span>
          </button>
        </div>
        <span id="login-password-error" class="auth-card__error" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required.</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 8 characters.</span>
        </span>
      </div>

      <!-- Forgot Password link -->
      <div class="auth-card__forgot">
        <a routerLink="/auth/forgot-password" class="auth-card__link">Forgot Password?</a>
      </div>

      <!-- Login button -->
      <button
        type="submit"
        class="auth-card__btn auth-card__btn--primary"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Signing in...' : 'Login' }}
      </button>

      <!-- Divider -->
      <div class="auth-card__divider">
        <span class="auth-card__divider-text">or</span>
      </div>

      <!-- Cancel button -->
      <button
        type="button"
        class="auth-card__btn auth-card__btn--outlined"
        (click)="onCancel()"
      >
        Cancel
      </button>
    </form>

    <!-- Sign Up link -->
    <p class="auth-card__footer">
      Don't have an account?
      <a routerLink="/auth/register" class="auth-card__link">Sign Up</a>
    </p>
  </div>
</section>
