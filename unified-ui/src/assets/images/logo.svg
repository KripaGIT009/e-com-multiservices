    <path d="M8 18h20v22c0 2-1.5 3.5-3.5 3.5h-13C9.5 43.5 8 42 8 40V18z"/>
    <!-- Bag handle -->
    <path d="M13 18v-4c0-3.3 2.7-6 6-6h-2c3.3 0 6 2.7 6 6v4" stroke="#FF6B35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Small diya/flame on bag -->
    <ellipse cx="18" cy="28" rx="4" ry="3" fill="#FFF8F0" opacity="0.9"/>
    <path d="M18 22c-1 2-1.5 3.5 0 5 1.5-1.5 1-3 0-5z" fill="#E55A24"/>
