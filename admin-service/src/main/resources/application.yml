server:
  port: 8011

spring:
  application:
    name: admin-service
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://admin_postgres:5432/admin_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: admin-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Service URLs
service:
  urls:
    order: http://order-service:8080
    payment: http://payment-service:8080
    inventory: http://inventory-service:8080
    user: http://user-service:8080
    item: http://item-service:8080
    cart: http://cart-service:8080
    checkout: http://checkout-service:8080
    return: http://return-service:8080
    logistics: http://logistics-service:8088
    notification: http://notification-service:8080

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:adminSecretKeyForJWTTokenGenerationAndValidation2025WithExtraLengthToMeetHS512Requirements}
  expiration: ${JWT_EXPIRATION:86400000}

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

workflow:
  order:
    action-priority:
      SHIP_ORDER: 100
      MARK_DELIVERED: 95
      RESERVE_INVENTORY: 90
      CONFIRM_PAYMENT: 85
      ISSUE_REFUND: 50
      CANCEL_ORDER: 10

dashboard:
  low-stock-threshold: 10
  activity-feed-limit: 20
  top-products-limit: 10
  downstream-timeout-ms: 4000

logging:
  level:
    com.example: DEBUG
    org.springframework.web: INFO
