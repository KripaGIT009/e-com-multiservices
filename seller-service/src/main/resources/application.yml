spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/seller_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  # Internal service behind the BFF. Surfacing the reason lets the BFF tell a
  # suspended seller *why* they cannot sign in, instead of "invalid credentials".
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

