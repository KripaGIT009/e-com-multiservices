spring:
  application:
    name: supplier-service
  datasource:
    url: jdbc:postgresql://localhost:5432/supplier_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    # Off so each REQUIRES_NEW transaction in dispatch gets a fresh EntityManager: a
    # lost unique-constraint race must not poison a session shared with the request.
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Supplier-order events are a side effect, not part of placing the order.
        # Without a bound the producer blocks the HTTP thread for the 60s default
        # looking for topic metadata whenever Kafka is unreachable.
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

server:
  port: 8080
  # Internal service behind the BFF: the reason ("Order is not paid") is the payload.
  error:
    include-message: always

order-service:
  url: ${ORDER_SERVICE_URL:http://localhost:8001}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
